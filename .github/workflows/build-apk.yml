name: Build Tiffin Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o TiffinTracker_Mobile_Build.zip -d mobile_build
          ls -la mobile_build/tiffin/TiffinTracker_AndroidStudio

      - name: Build debug APK
        working-directory: mobile_build/tiffin/TiffinTracker_AndroidStudio
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TiffinTracker-debug-apk
          path: mobile_build/tiffin/TiffinTracker_AndroidStudio/app/build/outputs/apk/debug/app-debug.apk
          
